<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forma</title>
  <meta name="description" content="An editor for mind maps, database diagrams, flowcharts, and web app mockups.">
  <link id="bootstrap-icon-css" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #f7f8f5;
      --paper: #fff;
      --ink: #23362f;
      --muted: #7a857e;
      --line: #e4e9e2;
      --green: #28765c;
      --pale: #edf4ed;
      --lime: #d8edb4;
      --shadow: 0 5px 24px #243d2910
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    body {
      margin: 0;
      color: var(--ink);
      font: 14px 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      overflow: hidden
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer;
      color: inherit;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, box-shadow .15s
    }

    button:hover {
      background: #f0f4ed
    }

    button:disabled {
      opacity: .4;
      cursor: default
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #398b69;
      outline-offset: 3px
    }

    button.primary {
      background: var(--green);
      color: white;
      border-color: var(--green)
    }

    button.primary:hover {
      background: #205f4b
    }

    button.ghost {
      background: transparent;
      border-color: transparent
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex-shrink: 0;
      vertical-align: middle
    }

    .app {
      display: grid;
      grid-template-columns: 238px 1fr;
      grid-template-rows: 70px 1fr;
      height: 100dvh
    }

    header {
      grid-column: 1/-1;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      z-index: 10
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 25px;
      letter-spacing: -1.2px;
      font-weight: 700
    }

    .brand-mark {
      background: var(--green);
      border-radius: 10px;
      padding: 8px;
      color: #e4f2cf;
      display: flex
    }

    .brand-mark .icon {
      width: 23px;
      height: 23px
    }


    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center
    }



    .sidebar {
      background: #fcfdfb;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 28px 17px 18px;
      z-index: 6
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.7px;
      font-weight: 700;
      color: #899389;
      text-transform: uppercase
    }

    .side-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 9px;
      margin-bottom: 16px
    }

    .side-heading button {
      padding: 4px;
      border: none;
      background: transparent
    }

    .board-list {
      overflow: auto;
      flex: 1
    }

    .board-item {
      width: 100%;
      text-align: left;
      justify-content: start;
      border: 1px solid transparent;
      background: transparent;
      padding: 12px 10px;
      margin-bottom: 5px;
      gap: 10px
    }

    .board-item .board-icon {
      display: flex;
      border-radius: 7px;
      padding: 7px;
      background: #eef1eb;
      color: #7a897a
    }

    .board-item.active {
      background: #eaf1e7;
      border-color: #dce7d6
    }

    .board-item.active .board-icon {
      background: #dce9d1;
      color: #527d48
    }

    .board-item span.title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      max-width: 143px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .board-item small {
      display: block;
      color: #8a948a;
      font-size: 10px;
      margin-top: 3px
    }

    .sidebar-foot {
      border-top: 1px solid var(--line);
      padding: 20px 9px 0
    }

    .sidebar-foot p {
      font-size: 11px;
      line-height: 1.8;
      color: #8a938b;
      margin: 10px 0 0
    }

    .sidebar-foot button {
      font-size: 12px;
      padding: 0
    }



    .main {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .board-header {
      padding: 25px 30px 19px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      background: #fcfdfb;
      border-bottom: 1px solid var(--line)
    }


    h1 {
      font-size: 24px;
      letter-spacing: -.7px;
      font-weight: 600;
      margin: 0;
      line-height: 1.3
    }

    .title-button {
      padding: 0;
      border: 0;
      background: none;
      justify-content: start;
      text-align: left;
      border-radius: 3px
    }

    .title-button .icon {
      opacity: 0;
      width: 15px
    }

    .title-button:hover .icon {
      opacity: .6
    }

    .board-subtitle {
      font-size: 11px;
      color: #8b958c;
      margin-top: 7px
    }

    .board-actions {
      display: flex;
      gap: 7px;
      align-items: center
    }

    .board-actions button {
      font-size: 12px
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
      background-color: #f8f9f5;
      background-image: radial-gradient(#cfd9cc 1px, transparent 1px);
      background-size: 22px 22px;
      touch-action: none
    }

    #mockup-center-guides {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 4;
    }

    #mockup-center-guides line {
      stroke: #d22b88;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    :root[data-theme=dark] #mockup-center-guides line { stroke: #ff80ce; }

    @media (max-width: 750px) {
      .canvas-wrap.moving-mockup-component .inspector { visibility: hidden; }
    }

    .canvas-wrap.linking {
      cursor: crosshair
    }

    .canvas-wrap.panning {
      cursor: grabbing
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      width: 1px;
      height: 1px
    }

    .wires {
      position: absolute;
      overflow: visible;
      width: 1px;
      height: 1px;
      left: 0;
      top: 0;
      pointer-events: none
    }

    .wires .hit {
      pointer-events: stroke;
      cursor: pointer;
      stroke: transparent;
      stroke-width: 17;
      fill: none
    }

    .wires.mind-wires {
      z-index: 1;
    }

    .wires .edge {
      fill: none;
      stroke-width: 2;
      pointer-events: none
    }

    .wires .selected {
      stroke: var(--green);
      stroke-width: 3
    }

    .edge-label {
      font: 11px 'Segoe UI', sans-serif;
      fill: #748275;
      pointer-events: none;
      paint-order: stroke;
      stroke: #f8f9f5;
      stroke-width: 6px;
      stroke-linejoin: round
    }

    .node {
      position: absolute;
      user-select: none;
      touch-action: none;
      cursor: grab;
      box-shadow: 0 3px 12px #34422f08
    }

    .node.selected {
      outline: 2px solid #3c8f6b;
      outline-offset: 5px
    }

    .node.link-source {
      outline: 2px dashed #398b69;
      outline-offset: 5px
    }

    .mind-node {
      min-height: 74px;
      border-radius: 13px;
      border: 1px solid #dce5d6;
      background: #fff;
      padding: 15px 18px;
      border-left: 4px solid var(--accent, #8bad72);
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .mind-node.root {
      min-height: 94px;
      background: var(--accent, #2c6954);
      color: white;
      border-color: var(--accent, #2c6954);
      box-shadow: 0 6px 18px #2560471a
    }

    .mind-node .node-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap
    }

    .mind-node.root .node-title {
      font-size: 19px;
      font-weight: 550;
      letter-spacing: -.3px
    }

    .mind-node .node-note {
      font-size: 10px;
      line-height: 1.5;
      margin-top: 5px;
      color: #8b9689;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 54px;
      overflow: hidden
    }

    .mind-node.root .node-note {
      color: #c1d5c4
    }

    .table-node {
      width: 260px;
      border: 1px solid #dbe3d9;
      border-radius: 11px;
      background: white;
      overflow: hidden
    }

    .table-head {
      background: #eaf1e6;
      border-bottom: 1px solid #dce5d6;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 15px;
      font-size: 13px;
      font-weight: 650;
      overflow-wrap: anywhere
    }

    .table-head .icon {
      color: #72935e;
      width: 15px
    }

    .table-fields {
      padding: 7px 0
    }

    .table-field {
      height: 31px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      font-size: 11px
    }

    .field-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .field-type {
      font-family: Consolas, monospace;
      font-size: 10px;
      color: #93a08e;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .key-tag {
      font-size: 8px;
      letter-spacing: .2px;
      font-weight: 700;
      min-width: 19px;
      color: #b99b48
    }

    .key-tag.fk {
      color: #6b93ad
    }

    .table-foot {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8f9c88;
      border-top: 1px solid #f0f2ed;
      padding: 8px 14px;
      background: #fcfdfb
    }

    .canvas-toolbar {
      position: absolute;
      left: 22px;
      top: 21px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 6px;
      border-radius: 12px;
      box-shadow: var(--shadow)
    }

    .canvas-toolbar button {
      border: 0;
      padding: 9px;
      border-radius: 7px
    }

    .canvas-toolbar button.active {
      background: #e7f1df;
      color: var(--green)
    }

    .tool-separator {
      height: 1px;
      background: var(--line);
      margin: 3px 5px
    }

    .canvas-footer {
      position: absolute;
      left: 23px;
      bottom: 20px;
      right: 23px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      gap: 15px;
      z-index: 3
    }

    .canvas-footer>* {
      pointer-events: auto
    }

    .canvas-hint {
      font-size: 10px;
      letter-spacing: .1px;
      color: #8a9686;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8f9f5d9;
      padding: 8px 0
    }

    .keycap {
      font-size: 9px;
      border: 1px solid #dce3d7;
      border-radius: 4px;
      padding: 2px 5px;
      background: white
    }

    .zoom-control {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
      padding: 3px
    }

    .zoom-control button {
      border: 0;
      padding: 7px
    }

    .zoom-control span {
      font-size: 11px;
      min-width: 42px;
      text-align: center;
      color: #7b8878
    }


    .inspector {
      position: absolute;
      right: 21px;
      top: 21px;
      width: 268px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 5;
      max-height: calc(100% - 105px);
      overflow: auto
    }

    .inspector.hidden {
      display: none
    }

    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 650
    }

    .inspector-header button {
      border: 0;
      padding: 0;
      background: transparent
    }

    .inspector-body {
      padding: 17px
    }

    .form-group {
      margin-bottom: 15px
    }

    .form-group label,
    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #7d8c77;
      margin-bottom: 7px
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #e0e6dc;
      border-radius: 6px;
      padding: 9px 10px;
      background: #fdfefc;
      color: var(--ink);
      font-size: 12px
    }

    textarea {
      resize: vertical;
      min-height: 70px;
      line-height: 1.6
    }

    input[type=color] {
      height: 35px;
      padding: 3px;
      cursor: pointer
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row>* {
      flex: 1;
      min-width: 0
    }

    .inspector button {
      font-size: 11px
    }

    .inspector .wide {
      width: 100%;
      margin-bottom: 8px
    }

    .danger {
      color: #b4665b !important
    }

    .muted {
      color: #8a9585;
      font-size: 11px;
      line-height: 1.7
    }

    .field-editor {
      border: 1px solid var(--line);
      padding: 9px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafcf7
    }

    .field-editor .row {
      margin-bottom: 6px
    }

    .field-editor input {
      font-size: 11px;
      padding: 6px
    }

    .field-editor label {
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #7b8875
    }

    .field-editor input[type=checkbox] {
      width: auto;
      accent-color: var(--green)
    }

    .field-editor .field-flags {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .field-editor button {
      padding: 2px;
      border: 0;
      background: none
    }

    .inspector hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 16px 0
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(100px);
      background: #263d31;
      color: #f2f8ec;
      padding: 12px 19px;
      border-radius: 10px;
      box-shadow: 0 6px 24px #263d3122;
      z-index: 100;
      transition: transform .2s;
      font-size: 12px;
      max-width: 90vw
    }

    .toast.show {
      transform: translateX(-50%) translateY(0)
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 25px 90px #15281f25;
      padding: 0;
      max-width: calc(100vw - 30px);
      width: 510px;
      color: var(--ink)
    }

    dialog::backdrop {
      background: #1c302a55;
      backdrop-filter: blur(3px)
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px 12px
    }

    dialog h2 {
      font-size: 21px;
      letter-spacing: -.6px;
      margin: 0;
      font-weight: 600
    }

    .dialog-head button {
      padding: 4px;
      border: 0
    }

    .dialog-body {
      padding: 7px 24px 24px
    }

    .dialog-body p {
      color: #82907d;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 0
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px
    }

    .type-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 7px
    }

    .type-choice {
      display: block;
      text-align: left;
      padding: 17px;
      border-radius: 10px
    }

    .type-choice strong {
      display: block;
      font-size: 13px;
      margin: 9px 0 5px
    }

    .type-choice small {
      color: #87947f;
      font-size: 11px;
      line-height: 1.5;
      display: block
    }

    .type-choice.active {
      border-color: #4b8b67;
      background: #eff5e9
    }

    .shortcut-list {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 13px;
      font-size: 12px;
      color: #6f7f68
    }

    .sql-area {
      font: 11px/1.6 Consolas, monospace;
      min-height: 210px;
      resize: vertical
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none
    }

    .empty-state h2 {
      font-size: 22px;
      font-weight: 550;
      letter-spacing: -.6px
    }

    .empty-state p {
      color: #8d9986;
      line-height: 1.8;
      font-size: 12px
    }

    .empty-state button {
      pointer-events: auto
    }

    .status-error {
      color: #b66c59;
      font-size: 11px;
      line-height: 1.6
    }

    .top-menu {
      display: flex;
      align-items: center
    }

    .mobile-toggle {
      display: none
    }

    .help-note {
      background: #f2f6ec;
      padding: 12px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.7;
      color: #7a8c6c
    }

    .save-status {
      color: #81907a
    }

    .export-options {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .export-options button {
      justify-content: start;
      padding: 15px
    }

    .export-options button small {
      margin-left: auto;
      color: #8d9986;
      font-size: 10px
    }

    .relation-card {
      font-size: 11px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px
    }

    .relation-card button {
      padding: 3px;
      border: none
    }

    .relation-card span {
      overflow-wrap: anywhere
    }

    .notice-banner {
      font-size: 11px;
      background: #f7f0df;
      border: 1px solid #ebdfbf;
      border-radius: 8px;
      color: #947847;
      padding: 10px;
      line-height: 1.6;
      margin-bottom: 13px
    }

    .search-box {
      margin: 0 6px 15px;
      position: relative
    }

    .search-box input {
      font-size: 11px;
      background: #f5f7f1;
      padding: 9px 10px 9px 31px;
      border-color: #edf0e7
    }

    .search-box .icon {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 13px;
      height: 13px;
      color: #9aa391
    }

    kbd {
      font-family: inherit
    }

    .small-count {
      font-size: 9px;
      padding: 3px 6px;
      background: #f0f4eb;
      color: #85917c;
      border-radius: 4px;
      margin-left: 5px
    }

    .header-actions button {
      font-size: 11px
    }

    .loading {
      padding: 30px;
      color: #657b5d
    }

    .field-warning {
      color: #ab7f48;
      font-size: 10px;
      line-height: 1.5;
      margin-bottom: 10px
    }

    @media(min-width:1600px) {
      .board-header {
        padding: 30px 36px 24px
      }

      .sidebar {
        padding-top: 31px
      }

      .app {
        grid-template-columns: 255px 1fr
      }
    }

    @media(max-width:1050px) {
      .app {
        grid-template-columns: 200px 1fr
      }

      .sidebar {
        padding: 22px 10px
      }

      .brand span:last-child {
        display: none
      }

      .board-header {
        padding: 20px
      }

      .board-actions .optional {
        display: none
      }

      .inspector {
        right: 15px;
        width: 247px
      }

      .header-actions {
        gap: 5px
      }

      .local-badge {
        display: none
      }
    }

    @media(max-width:750px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 60px 1fr
      }

      header {
        padding: 0 13px
      }

      .brand {
        font-size: 22px
      }

      .brand-mark {
        padding: 6px
      }

      .header-actions button {
        padding: 8px
      }

      .header-actions .label {
        display: none
      }

      .sidebar {
        position: absolute;
        left: 0;
        top: 60px;
        bottom: 0;
        width: 225px;
        box-shadow: 10px 0 25px #23362f1a;
        transform: translateX(-110%);
        transition: transform .2s
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .mobile-toggle {

    /* The editor theme never filters or inverts saved canvas artwork. */
    :root[data-theme=dark] {

    [data-theme=dark] :is(.muted, .eyebrow, .local-badge, .breadcrumb, .board-subtitle, .sidebar-foot p, .form-group label, .form-label, .dialog-body p, .type-choice small, .board-item small, .small-count, .canvas-hint, .zoom-control span, .scan-field-hint, .scan-selection, .scan-explanation, .scan-limits, .scan-options, .scan-options summary, .scan-section-title, .scan-dialog label, .scan-privacy, .docs-source-label, .docs-footnote, .element-check, .element-format-row label, .mockup-size, .component-card small, .template-card small, .scan-doc-card strong, .scan-doc-card p, .field-editor label, .save-status, .empty-state p, .export-options button small) {

    /* Editor surfaces and controls */
    :root {
      --panel: #f6f7f4;
      --surface: #fdfefb;
      --surface-hover: #e9ede8;
      --canvas: #f0f2ee;
      --grid-dot: #c9d1ca;
      --ink: #202b27;
      --muted: #52645c;
      --line: #d4ddd6;
      --control-line: #aebdb4;
      --paper: #fcfdfa;
      --green: #215e4d;
      --pale: #e0eee6;
      --selected-ink: #194c3d;
      --action: #215e4d;
      --action-hover: #194c3e;
      --action-ink: #fff;
      --ring: #28765c;
      --danger-ink: #9d3429;
      --panel-shadow: 0 8px 24px #172b2526;
    }

    :root[data-theme=dark] {
      --panel: #202726;
      --surface: #232c2a;
      --surface-hover: #303b38;
      --canvas: #171e1d;
      --grid-dot: #364440;
      --ink: #edf2ed;
      --muted: #aabdb4;
      --line: #394743;
      --control-line: #657a70;
      --paper: #232c2a;
      --green: #85d7b5;
      --pale: #2b453c;
      --selected-ink: #b9ebd3;
      --action: #9edebf;
      --action-hover: #baeace;
      --action-ink: #152a22;
      --ring: #a2e6c2;
      --danger-ink: #ffb4a7;
      --panel-shadow: 0 8px 24px #0a100f70;
    }

    body { font: 14px/1.4 'Segoe UI', system-ui, sans-serif; }
    ::selection { color: var(--selected-ink); background: var(--pale); }

    :root :is(button, input, select, textarea, summary, [tabindex]):focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    :root :is(input, textarea, select):not([type=color], [type=radio], [type=checkbox]) {
      background: var(--canvas);
      border-color: var(--control-line);
      border-radius: 6px;
      color: var(--ink);
      caret-color: var(--ring);
    }

    :root :is(input, textarea)::placeholder { color: var(--muted); opacity: 1; }
    :root :is(input[type=checkbox], input[type=radio]) { accent-color: var(--ring); }

    :root button {
      background: var(--surface);
      border-color: var(--control-line);
      border-radius: 6px;
    }

    :root button:hover:not(:disabled) { background: var(--surface-hover); }
    :root button.primary {
      background: var(--action);
      border-color: var(--action);
      color: var(--action-ink);
      font-weight: 650;
    }
    :root button.primary:hover:not(:disabled) { background: var(--action-hover); }
    :root button.danger { color: var(--danger-ink); }
    :root button.ghost { background: transparent; border-color: transparent; }

    .app {
      --appbar-height: 58px;
      --workspace-width: 236px;
      grid-template-rows: var(--appbar-height) minmax(0, 1fr);
    }
    :root header { padding: 0 20px; background: var(--surface); }
    .top-menu, .header-actions { gap: 8px; }
    .header-actions { max-width: none; overflow: visible; }
    .header-actions button { min-height: 36px; padding: 7px 10px; font-size: 13px; white-space: nowrap; }
    .header-actions .label { display: inline; }
    #mobile-menu { width: 36px; margin-right: 0; border-color: transparent; }
    .brand { gap: 8px; font-size: 20px; letter-spacing: -.45px; }
    .brand-mark { background: var(--pale); color: var(--selected-ink); padding: 5px; border-radius: 6px; }
    .brand-mark .icon { width: 20px; height: 20px; }
    .save-indicator { font-size: 12px; color: var(--muted); margin-inline-end: 6px; }
    .save-indicator[data-state=error] { color: var(--danger-ink); font-weight: 600; }
    .header-actions #theme-toggle { width: 36px; padding: 0; }

    #workspace-menu {
      position: fixed;
      inset: calc(var(--appbar-height) - 4px) 20px auto auto;
      margin: 0;
      width: min(230px, calc(100vw - 24px));
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--panel-shadow);
    }

    #workspace-menu button {
      display: flex;
      width: 100%;
      min-height: 38px;
      justify-content: flex-start;
      padding: 7px 10px;
      font-size: 13px;
      border-color: transparent;
    }

    #workspace-menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--line); }

    :root .sidebar { padding: 16px 12px 12px; gap: 12px; background: var(--panel); }
    .side-heading { align-items: center; padding: 0 3px 0 6px; }
    .workspace-heading { display: flex; gap: 8px; align-items: baseline; }
    .workspace-heading h2 { margin: 0; font-size: 14px; }
    #board-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .side-heading #workspace-close { border-color: transparent; }
    #board-search { height: 36px; font-size: 13px; background: var(--canvas); border-color: var(--control-line); }
    .board-list { padding: 2px; }
    .board-row .board-item { padding: 8px 33px 8px 8px; margin-bottom: 2px; gap: 8px; }
    :root .board-item, :root .sidebar .board-item .board-icon { background: transparent; border-color: transparent; }
    :root .sidebar .board-item.active, :root .sidebar .board-item.active:hover {
      background: var(--pale);
      border-color: transparent;
      color: var(--selected-ink);
    }
    :root .board-item .board-icon { color: var(--muted); flex: 0 0 22px; padding: 3px 0; }
    :root .sidebar .board-item.active .board-icon { color: var(--selected-ink); background: transparent; }
    .board-item span.title { font-size: 13px; }
    :root .board-item small { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .board-delete { top: 9px; opacity: 1; }
    :root .board-delete:hover { color: var(--danger-ink); background: var(--surface-hover); }
    @media (hover: hover) {
      .board-delete { opacity: 0; }
      .board-row:hover .board-delete, .board-row:focus-within .board-delete { opacity: 1; }
    }

    .sidebar-foot { padding-top: 8px; }
    .sidebar-foot #help-button, .sidebar-foot #workspace-manage {
      border-color: transparent;
      font-size: 12px;
      min-height: 36px;
      padding: 7px 9px;
      margin-top: 0;
    }

    :root .board-header {
      padding: 13px 20px;
      gap: 10px 20px;
      background: var(--surface);
      flex: 0 0 auto;
    }
    .board-heading { min-width: 0; }
    .title-button { max-width: 100%; gap: 8px; }
    .title-button h1 {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -.4px;
    }
    .title-button :is(.icon, .library-icon) { color: var(--muted); opacity: 1; width: 15px; height: 15px; }
    .board-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; margin-top: 4px; }
    .board-meta, :root .board-subtitle { color: var(--muted); font-size: 12px; }
    .board-subtitle { margin: 0; font-variant-numeric: tabular-nums; }
    .board-actions { flex-wrap: wrap; max-width: none; gap: 5px; justify-content: flex-end; }
    .board-actions button { min-height: 36px; padding: 6px 10px; white-space: nowrap; }
    .board-actions :is(.history-button, #page-layout-button) .icon { width: 16px; height: 16px; }
    .board-actions .history-button { display: inline-flex; width: 36px; padding: 0; }
    .board-actions #sql-button:not([hidden]) { display: inline-flex; }
    .board-actions #add-button { margin-inline-start: 4px; }

    .canvas-wrap {
      background-color: var(--canvas);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    :root :is(.canvas-toolbar, .zoom-control) {
      background: var(--surface);
      box-shadow: none;
      border-color: var(--line);
      border-radius: 8px;
      padding: 4px;
      gap: 2px;
    }
    .canvas-toolbar { left: 16px; top: 16px; }
    :root :is(.canvas-toolbar, .zoom-control) button {
      width: 36px;
      height: 36px;
      padding: 0;
      background: transparent;
      border: 0;
    }
    :root .canvas-toolbar button.active { color: var(--selected-ink); background: var(--pale); }
    .tool-separator { margin: 3px 5px; }
    :root .zoom-control span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .canvas-footer { left: 16px; right: 16px; bottom: 16px; }
    :root .canvas-hint { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 0; }
    :root .canvas-hint[data-tool=link] { background: var(--surface); border-color: var(--line); padding: 6px 9px; }
    .zoom-control { margin-left: auto; }
    :root .canvas-hint .keycap {
      font-family: inherit;
      font-size: 11px;
      line-height: 1.2;
      background: var(--surface);
      border-color: var(--line);
      color: var(--muted);
    }

    :root :is(.mind-node, .mind-node.root) {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid color-mix(in srgb, var(--accent) 52%, var(--line));
      border-radius: 8px;
      box-shadow: none;
    }
    :root .mind-node.root {
      background: color-mix(in srgb, var(--accent) 21%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 80%, var(--control-line));
    }
    :root .mind-node :is(.node-note, .root .node-note) { color: var(--muted); }
    .node.selected, .node.link-source { outline-color: var(--ring); outline-offset: 3px; }
    :root :is(.table-node, .inspector) { background: var(--surface); border-color: var(--line); border-radius: 8px; }
    :root .table-node { box-shadow: none; }
    :root :is(.table-head, .table-foot) { background: var(--panel); border-color: var(--line); color: var(--ink); }
    :root :is(.table-foot, .field-type) { color: var(--muted); }

    }

    }

    }

      if (Number.isFinite(b.codeScan.nodeLimitOmissions) && b.codeScan.nodeLimitOmissions > 0) p('Some items were omitted from the diagram by its node limit. A structured report may still include their scanned file metadata.');
      heading('Details to complete through source review');
      list(['Confirm the project purpose, module responsibilities, and business workflows.', 'Document verified installation, build, run, and test commands from the project’s own instructions.', 'Record runtime requirements, environment-variable names, and deployment steps without including secret values.', 'Review request/response formats, authentication, authorization, database behavior, and error handling.', 'Review files and symbols outside scan coverage, and rescan after code changes.']);
      return { blocks, snapshot: s, routeCount: routes.length, declarationCount: declarations.length };
    }
    function documentationMarkdown(model) {
      const text = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/([`*_\[\]<>#|])/g, '\\$1').replace(/[\r\n]+/g, ' ');
      return model.blocks.map(b => b.type === 'heading' ? '#'.repeat(b.level) + ' ' + text(b.text) : b.type === 'paragraph' ? text(b.text) : b.type === 'list' ? b.items.map(x => '- ' + text(x)).join('\n') : b.type === 'table' ? '| ' + b.headers.map(text).join(' | ') + ' |\n| ' + b.headers.map(() => '---').join(' | ') + ' |\n' + b.rows.map(row => '| ' + row.map(text).join(' | ') + ' |').join('\n') : '').join('\n\n') + '\n';
    }
    function documentationBodyHTML(model) {
      let section = 0;
      return model.blocks.map(b => b.type === 'heading' ? `<h${b.level}${b.level === 2 ? ` id="doc-section-${section++}"` : ''}>${esc(b.text)}</h${b.level}>` : b.type === 'paragraph' ? `<p>${esc(b.text)}</p>` : b.type === 'list' ? '<ul>' + b.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : b.type === 'table' ? '<div class="doc-table-wrap"><table><thead><tr>' + b.headers.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + b.rows.map(row => '<tr>' + row.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '').join('\n');
    }
    const DOCUMENT_STYLE = 'body{margin:0;background:#f5f7f1;color:#26372c;font:14px/1.7 system-ui,sans-serif}.doc-paper{max-width:1100px;margin:32px auto;background:white;padding:40px;border:1px solid #e3e9dc;border-radius:12px;overflow-wrap:anywhere}.doc-paper h1{font-size:28px;line-height:1.3;letter-spacing:-.6px}.doc-paper h2{font-size:19px;line-height:1.5;margin:32px 0 12px;padding-top:8px;border-top:1px solid #e5eadf}.doc-paper p,.doc-paper li{font-size:12px;line-height:1.8;color:#63745b}.doc-paper ul{padding-left:21px}.doc-table-wrap{overflow-x:auto;max-width:100%;margin:14px 0}.doc-paper table{border-collapse:collapse;width:100%;font-size:11px;text-align:left;table-layout:auto}.doc-paper th{background:#edf3e7;color:#4c6d3d;font-weight:600}.doc-paper th,.doc-paper td{padding:10px 12px;border:1px solid #e3e9dc;vertical-align:top;overflow-wrap:anywhere;min-width:60px;max-width:520px}.doc-paper tbody tr:nth-child(even){background:#fafcf7}@media(max-width:600px){.doc-paper{margin:12px;padding:20px}.doc-paper h1{font-size:23px}.doc-paper th,.doc-paper td{padding:8px;min-width:90px}}@media print{body{background:white}.doc-paper{max-width:none;margin:0;padding:0;border:0}h2{break-after:avoid}tr{break-inside:avoid}.doc-table-wrap{overflow:visible}table{width:100%}thead{display:table-header-group}}';
    function documentationFileHTML(model) { return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(model.snapshot.root) + ' — Codebase documentation</title><style>' + DOCUMENT_STYLE + '</style></head><body><main class="doc-paper">' + documentationBodyHTML(model) + '</main></body></html>' }
    function documentationDialog(target = board, back = null) {
      let model; try { model = documentationModel(target) } catch (e) { toast(e.message); return }
      const markdown = documentationMarkdown(model), body = documentationBodyHTML(model), sections = model.blocks.filter(b => b.type === 'heading' && b.level === 2);
      openModal('Codebase documentation', `<div class="docs-toolbar"><div class="docs-tabs" role="tablist" aria-label="Documentation format"><button id="docs-preview-tab" class="active" role="tab" aria-selected="true" aria-controls="docs-preview-pane">Preview</button><button id="docs-markdown-tab" role="tab" aria-selected="false" aria-controls="docs-markdown-pane">Markdown</button></div><span class="muted docs-count">${model.snapshot.files.length} file records &middot; ${model.routeCount} route matches</span></div><div class="docs-content"><div id="docs-preview-pane" role="tabpanel" aria-labelledby="docs-preview-tab"><nav class="docs-nav" aria-label="Document sections">${sections.map((s, i) => `<button class="docs-section-link" data-section="doc-section-${i}">${esc(s.text)}</button>`).join('')}</nav><article class="doc-paper">${body}</article></div><div id="docs-markdown-pane" role="tabpanel" aria-labelledby="docs-markdown-tab" hidden><label class="docs-source-label" for="docs-markdown-source">Generated Markdown &mdash; select and copy, or download an editable file.</label><textarea id="docs-markdown-source" readonly spellcheck="false">${esc(markdown)}</textarea></div></div><div class="scan-footer docs-footer"><div class="docs-footnote">${model.snapshot.legacy ? 'Legacy board notes are partial. Rescan for structured documentation.' : 'Based on the saved scan; later source changes require a rescan.'}</div><div class="dialog-actions"><button id="docs-back">${back ? 'Back to scan' : 'Close'}</button><div class="docs-export-actions"><button id="docs-copy">Copy Markdown</button><button id="docs-html">Download HTML</button><button class="primary" id="docs-download">${ico('download')}Download .md</button></div></div></div>`);
      $('modal').classList.add('scan-dialog'); $('modal').classList.add('docs-dialog');
      const showTab = preview => { $('docs-preview-pane').hidden = !preview; $('docs-markdown-pane').hidden = preview; $('docs-preview-tab').classList.toggle('active', preview); $('docs-markdown-tab').classList.toggle('active', !preview); $('docs-preview-tab').setAttribute('aria-selected', String(preview)); $('docs-markdown-tab').setAttribute('aria-selected', String(!preview)) };
      $('docs-preview-tab').onclick = () => showTab(true); $('docs-markdown-tab').onclick = () => showTab(false);
      $('docs-back').onclick = () => { if (back) { $('modal').classList.remove('docs-dialog'); back() } else closeModal() };
      const name = String(target.name || 'codebase').replace(/[^a-z0-9_-]+/gi, '-').replace(/^-|-$/g, '') || 'codebase';
      $('docs-download').onclick = () => { download(name + '-documentation.md', markdown, 'text/markdown;charset=utf-8'); toast('Markdown documentation downloaded') };
      $('docs-html').onclick = () => { download(name + '-documentation.html', documentationFileHTML(model), 'text/html;charset=utf-8'); toast('HTML documentation downloaded. Open it in a browser to print.') };
      $('docs-copy').onclick = async () => { try { await navigator.clipboard.writeText(markdown); toast('Documentation copied') } catch (e) { showTab(false); $('docs-markdown-source').focus(); $('docs-markdown-source').select(); toast('Press Ctrl+C to copy the selected Markdown.') } };
      $('modal').querySelectorAll('.docs-section-link').forEach(button => button.onclick = () => { $(button.dataset.section)?.scrollIntoView({ behavior: 'smooth', block: 'start' }) });
    }
    $('documentation-button').onclick = () => documentationDialog();
    $('modal').addEventListener('close', () => $('modal').classList.remove('docs-dialog'));


    render(); requestAnimationFrame(() => fit()); if (!storageAvailable) { updateSaveStatus(false); setTimeout(() => toast('Browser storage could not be read. Export JSON to keep a backup.'), 600) } else persist();
    window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); persist() }); let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { applyView(); renderWires() }, 150) });
  </script>
</body>
